# Configuração do Alembic (migrações do banco).
# A URL do banco vem das mesmas variáveis da aplicação (.env), veja migracoes/env.py.
#
# Uso:
#   python -m scripts.criar_tabelas      # aplica as migrações (recomendado)
#   alembic upgrade head                 # equivalente, direto pelo Alembic
#   alembic revision -m "descricao"      # nova migração

[alembic]
script_location = %(here)s/migracoes
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
