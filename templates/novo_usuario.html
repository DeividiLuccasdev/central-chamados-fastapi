<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Novo Usuário - Central de Chamados</title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >
</head>

<body>

<div class="layout">

    <!-- MENU LATERAL -->
    <aside class="sidebar">

        <h2>Central de Chamados</h2>

        <div class="usuario-logado">
            👤 {{ request.session.get("usuario_nome") }}
        </div>

        <nav>
            <a href="/dashboard">🏠 Dashboard</a>
            <a href="/chamados-web">🎫 Chamados</a>
            <a href="/novo-chamado">➕ Novo Chamado</a>
            <a href="/usuarios-web">👤 Usuários</a>
            <a href="/logout">🚪 Sair</a>
        </nav>

    </aside>


    <!-- CONTEÚDO -->
    <main class="conteudo">

        <div class="topo">

            <div>
                <h1>Cadastrar Usuário</h1>

                <p>
                    Crie um novo usuário para acessar a Central de Chamados.
                </p>
            </div>

        </div>


        <div class="detalhes-chamado cadastro-usuario-card">

            {% if erro %}

                <div class="erro-login">
                    ⚠️ {{ erro }}
                </div>

            {% endif %}


            <form
                method="POST"
                action="/novo-usuario"
            >

                <label for="nome">
                    Nome
                </label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite o nome completo"
                    required
                >


                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite o e-mail"
                    autocomplete="email"
                    required
                >


                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite uma senha"
                    autocomplete="new-password"
                    required
                >


                <button type="submit">
                    Cadastrar Usuário
                </button>

            </form>

        </div>

    </main>

</div>

</body>

</html>
